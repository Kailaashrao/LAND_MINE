<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health History – Life Band</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 font-sans">

  <div id="app-sidebar"></div>

  <div class="main-content">
    <div id="app-topbar"></div>

    <main class="p-6 lg:p-8">

      <!-- Filters Row -->
      <div class="flex flex-wrap items-center gap-4 mb-6">
        <!-- Date range -->
        <div class="flex items-center gap-2 bg-white rounded-xl border border-slate-200 p-1.5 shadow-sm">
          <button onclick="setRange(7)" id="r7" class="px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white transition">7 Days</button>
          <button onclick="setRange(14)" id="r14" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-50 transition">14 Days</button>
          <button onclick="setRange(30)" id="r30" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-50 transition">30 Days</button>
        </div>

        <!-- Metric filter -->
        <div class="flex items-center gap-2 bg-white rounded-xl border border-slate-200 p-1.5 shadow-sm">
          <button onclick="setMetric('all')" id="mAll" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-900 text-white transition">All</button>
          <button onclick="setMetric('stress')" id="mStress" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-50 transition">Stress</button>
          <button onclick="setMetric('bp')" id="mBP" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-50 transition">Blood Pressure</button>
          <button onclick="setMetric('hr')" id="mHR" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-50 transition">Heart Rate</button>
        </div>

        <div class="ml-auto">
          <button onclick="exportHistoryPDF()" class="btn-secondary text-sm py-2">
            <i data-lucide="download" class="w-4 h-4"></i>
            Export PDF
          </button>
        </div>
      </div>

      <!-- Charts -->
      <div id="chartStress" class="chart-card mb-6">
        <h3 class="text-base font-bold text-slate-900 mb-1">Stress Level History</h3>
        <p class="text-xs text-slate-500 mb-4">Average daily stress percentage</p>
        <div class="chart-container" style="height:260px">
          <canvas id="stressHistChart"></canvas>
        </div>
      </div>

      <div id="chartBP" class="chart-card mb-6">
        <h3 class="text-base font-bold text-slate-900 mb-1">Blood Pressure History</h3>
        <p class="text-xs text-slate-500 mb-4">Systolic / Diastolic daily averages</p>
        <div class="chart-container" style="height:260px">
          <canvas id="bpHistChart"></canvas>
        </div>
      </div>

      <div id="chartHR" class="chart-card mb-6">
        <h3 class="text-base font-bold text-slate-900 mb-1">Heart Rate History</h3>
        <p class="text-xs text-slate-500 mb-4">Average daily heart rate (bpm)</p>
        <div class="chart-container" style="height:260px">
          <canvas id="hrHistChart"></canvas>
        </div>
      </div>

      <!-- Daily breakdown table -->
      <div class="chart-card">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-base font-bold text-slate-900">Daily Breakdown</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Avg Stress</th>
                <th>Avg BP</th>
                <th>Avg HR</th>
                <th>Avg SpO₂</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="historyTable"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/animations.js"></script>
  <script>
    if (!App.Auth.requireAuth('individual')) throw 'redirect';
    App.initDashboardShell('history.html', 'Health History', 'Review your historical health data');
    Charts.configure();

    const allReadings = MockData.loadReadings();
    let currentRange = 7;
    let currentMetric = 'all';
    let charts = {};

    function getFilteredData() {
      const all = MockData.getDailyAverages(allReadings);
      return all.slice(-currentRange);
    }

    function buildCharts() {
      const data = getFilteredData();
      const labels = data.map(d => d.date);

      // Destroy existing
      Object.values(charts).forEach(c => c.destroy && c.destroy());
      charts = {};

      // Stress
      if (currentMetric === 'all' || currentMetric === 'stress') {
        document.getElementById('chartStress').style.display = '';
        const ctx = document.getElementById('stressHistChart').getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 260);
        grad.addColorStop(0, 'rgba(37,99,235,0.12)');
        grad.addColorStop(1, 'rgba(37,99,235,0)');
        charts.stress = new Chart(ctx, {
          type: 'line',
          data: { labels, datasets: [{ label: 'Stress %', data: data.map(d => d.stress), borderColor: '#2563EB', backgroundColor: grad, fill: true, borderWidth: 2.5, pointBackgroundColor: '#fff', pointBorderColor: '#2563EB', pointBorderWidth: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } }, x: { ticks: { maxRotation: 0 } } } }
        });
      } else {
        document.getElementById('chartStress').style.display = 'none';
      }

      // BP
      if (currentMetric === 'all' || currentMetric === 'bp') {
        document.getElementById('chartBP').style.display = '';
        const ctx2 = document.getElementById('bpHistChart').getContext('2d');
        charts.bp = new Chart(ctx2, {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label: 'Systolic', data: data.map(d => d.systolic), borderColor: '#EF4444', backgroundColor: 'rgba(239,68,68,0.06)', fill: true, borderWidth: 2.5, pointBackgroundColor: '#fff', pointBorderColor: '#EF4444', pointBorderWidth: 2 },
              { label: 'Diastolic', data: data.map(d => d.diastolic), borderColor: '#F97316', borderDash: [5,5], borderWidth: 2, pointBackgroundColor: '#fff', pointBorderColor: '#F97316', pointBorderWidth: 2 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { min: 50, max: 170 }, x: { ticks: { maxRotation: 0 } } } }
        });
      } else {
        document.getElementById('chartBP').style.display = 'none';
      }

      // HR
      if (currentMetric === 'all' || currentMetric === 'hr') {
        document.getElementById('chartHR').style.display = '';
        const ctx3 = document.getElementById('hrHistChart').getContext('2d');
        const grad3 = ctx3.createLinearGradient(0, 0, 0, 260);
        grad3.addColorStop(0, 'rgba(16,185,129,0.12)');
        grad3.addColorStop(1, 'rgba(16,185,129,0)');
        charts.hr = new Chart(ctx3, {
          type: 'line',
          data: { labels, datasets: [{ label: 'Heart Rate (bpm)', data: data.map(d => d.heartRate), borderColor: '#10B981', backgroundColor: grad3, fill: true, borderWidth: 2.5, pointBackgroundColor: '#fff', pointBorderColor: '#10B981', pointBorderWidth: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 50, max: 120 }, x: { ticks: { maxRotation: 0 } } } }
        });
      } else {
        document.getElementById('chartHR').style.display = 'none';
      }
    }

    function buildTable() {
      const data = getFilteredData();
      document.getElementById('historyTable').innerHTML = data.map(d => {
        const status = d.stress >= 80 ? 'critical' : d.stress >= 60 ? 'warning' : 'normal';
        return `<tr>
          <td class="font-medium">${d.date}</td>
          <td>${d.stress}%</td>
          <td>${d.systolic}/${d.diastolic} mmHg</td>
          <td>${d.heartRate} bpm</td>
          <td>${d.spo2}%</td>
          <td>${App.statusBadge(status)}</td>
        </tr>`;
      }).join('');
    }

    function setRange(days) {
      currentRange = days;
      ['r7','r14','r30'].forEach(id => {
        const el = document.getElementById(id);
        if (parseInt(id.replace('r','')) === days) {
          el.className = 'px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white transition';
        } else {
          el.className = 'px-4 py-2 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-50 transition';
        }
      });
      buildCharts();
      buildTable();
    }

    function setMetric(m) {
      currentMetric = m;
      const map = { all: 'mAll', stress: 'mStress', bp: 'mBP', hr: 'mHR' };
      Object.entries(map).forEach(([key, id]) => {
        const el = document.getElementById(id);
        if (key === m) {
          el.className = 'px-4 py-2 rounded-lg text-xs font-semibold bg-slate-900 text-white transition';
        } else {
          el.className = 'px-4 py-2 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-50 transition';
        }
      });
      buildCharts();
    }

    function exportHistoryPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const user = App.Auth.getUser();
      const data = getFilteredData();

      doc.setFontSize(18);
      doc.setTextColor(37, 99, 235);
      doc.text('Life Band – Health History Report', 20, 25);
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text(`Patient: ${user.name} · Range: Last ${currentRange} days · Generated: ${new Date().toLocaleDateString()}`, 20, 33);
      doc.line(20, 37, 190, 37);

      doc.autoTable({
        startY: 42,
        head: [['Date', 'Stress %', 'Systolic', 'Diastolic', 'HR (bpm)', 'SpO₂ %']],
        body: data.map(d => [d.date, d.stress, d.systolic, d.diastolic, d.heartRate, d.spo2]),
        theme: 'grid',
        headStyles: { fillColor: [37, 99, 235] },
        styles: { fontSize: 9 }
      });

      doc.save('LifeBand-History-Report.pdf');
      App.showToast('History report exported', 'success');
    }

    // Init
    buildCharts();
    buildTable();
  </script>
</body>
</html>
