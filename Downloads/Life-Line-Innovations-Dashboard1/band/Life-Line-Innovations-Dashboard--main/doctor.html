<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Doctor – Life Band</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 font-sans">

  <div id="app-sidebar"></div>

  <div class="main-content">
    <div id="app-topbar"></div>

    <main class="p-6 lg:p-8">

      <!-- Emergency Banner -->
      <div class="mb-6 bg-red-50 border border-red-200 rounded-xl p-4 flex items-center gap-3 animate-fadeInDown">
        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0 animate-heartbeat">
          <i data-lucide="phone" class="w-5 h-5 text-red-600"></i>
        </div>
        <div class="flex-1">
          <div class="text-red-800 font-semibold text-sm">Medical Emergency?</div>
          <div class="text-red-600 text-sm">Call <strong>911</strong> immediately or go to your nearest emergency room.</div>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="flex flex-wrap items-center gap-4 mb-6">
        <div class="relative flex-1 min-w-0 sm:min-w-[250px]">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="text" id="searchDoctor" class="form-input pl-10" placeholder="Search by name or specialty..." oninput="filterDoctors()">
        </div>
        <select id="specialtyFilter" class="form-input w-auto" onchange="filterDoctors()">
          <option value="">All Specialties</option>
          <option value="Cardiologist">Cardiologist</option>
          <option value="Stress & Anxiety Specialist">Stress & Anxiety</option>
          <option value="General Practitioner">General Practitioner</option>
          <option value="Neurologist">Neurologist</option>
          <option value="Psychologist">Psychologist</option>
          <option value="Internal Medicine">Internal Medicine</option>
        </select>
        <div class="flex items-center gap-2 text-sm text-slate-500">
          <i data-lucide="map-pin" class="w-4 h-4"></i>
          <span>Showing results near you</span>
        </div>
      </div>

      <!-- Doctor Cards -->
      <div id="doctorGrid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5"></div>

      <!-- ML Ready notice -->
      <div class="mt-10 bg-gradient-to-r from-violet-50 to-blue-50 rounded-2xl border border-violet-200 p-8 text-center">
        <div class="w-14 h-14 rounded-xl bg-violet-100 flex items-center justify-center mx-auto mb-4">
          <i data-lucide="brain" class="w-7 h-7 text-violet-600"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-900 mb-2">AI-Powered Matching Coming Soon</h3>
        <p class="text-slate-500 text-sm max-w-lg mx-auto">Life Band will soon use machine learning to match you with the best specialists based on your unique health data, symptom patterns, and treatment history.</p>
      </div>

    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/animations.js"></script>
  <script>
    if (!App.Auth.requireAuth('individual')) throw 'redirect';
    App.initDashboardShell('doctor.html', 'Find a Doctor', 'Specialists & therapists near you');

    function renderDoctors(list) {
      const grid = document.getElementById('doctorGrid');
      if (!list.length) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">No doctors match your search.</div>';
        return;
      }
      grid.innerHTML = list.map((doc, i) => `
        <div class="bg-white rounded-xl border border-slate-200 p-5 hover:shadow-lg transition-all animate-fadeInUp" style="opacity:0; animation-delay:${i * 0.08}s">
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 rounded-full bg-gradient-to-br from-blue-100 to-blue-200 flex items-center justify-center text-blue-700 font-bold text-lg flex-shrink-0">
              ${doc.avatar}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <h4 class="text-sm font-bold text-slate-900 truncate">${doc.name}</h4>
                ${doc.available ? '<span class="w-2 h-2 bg-green-500 rounded-full flex-shrink-0" title="Available"></span>' : '<span class="w-2 h-2 bg-slate-300 rounded-full flex-shrink-0" title="Unavailable"></span>'}
              </div>
              <p class="text-xs text-blue-600 font-medium mt-0.5">${doc.specialty}</p>
              <p class="text-xs text-slate-500 mt-1">${doc.experience} experience</p>
            </div>
          </div>

          <div class="mt-4 flex items-center gap-4 text-xs text-slate-500">
            <div class="flex items-center gap-1">
              <i data-lucide="star" class="w-3.5 h-3.5 text-amber-400 fill-amber-400"></i>
              <span class="font-semibold text-slate-700">${doc.rating}</span>
              <span>(${doc.reviews})</span>
            </div>
            <div class="flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
              <span>${doc.distance}</span>
            </div>
          </div>

          <div class="text-xs text-slate-500 mt-2 flex items-center gap-1">
            <i data-lucide="building-2" class="w-3.5 h-3.5"></i>
            ${doc.location}
          </div>

          <div class="flex gap-2 mt-4">
            <button onclick="App.showToast('Calling ${doc.name}...', 'info')" class="flex-1 py-2.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-700 hover:bg-slate-50 transition flex items-center justify-center gap-1.5 ${doc.available ? '' : 'opacity-50 cursor-not-allowed'}" ${doc.available ? '' : 'disabled'}>
              <i data-lucide="phone" class="w-3.5 h-3.5"></i>
              Call
            </button>
            <button onclick="App.showToast('Appointment request sent to ${doc.name}', 'success')" class="flex-1 py-2.5 rounded-lg text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700 transition flex items-center justify-center gap-1.5 ${doc.available ? '' : 'opacity-50 cursor-not-allowed'}" ${doc.available ? '' : 'disabled'}>
              <i data-lucide="calendar-check" class="w-3.5 h-3.5"></i>
              Book
            </button>
          </div>
        </div>
      `).join('');

      requestAnimationFrame(() => lucide.createIcons());
    }

    function filterDoctors() {
      const query = document.getElementById('searchDoctor').value.toLowerCase();
      const specialty = document.getElementById('specialtyFilter').value;
      let filtered = MockData.doctors;
      if (query) filtered = filtered.filter(d => d.name.toLowerCase().includes(query) || d.specialty.toLowerCase().includes(query));
      if (specialty) filtered = filtered.filter(d => d.specialty === specialty);
      renderDoctors(filtered);
    }

    renderDoctors(MockData.doctors);
  </script>
</body>
</html>
